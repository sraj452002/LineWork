# The Linework API (backend/) on Render, as a Blueprint: Render → New → Blueprint → this repo.
# The frontend (frontend/) is on Netlify, with BACKEND_URL set to this service's address.
services:
  - type: web
    name: linework-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/server
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Netlify's proxy, then Render's load balancer (see backend/.env.example).
      - key: TRUST_PROXY
        value: "2"
      # The frontend's address on Netlify, e.g. https://linework.netlify.app
      - key: APP_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      # Encrypts workflow credentials; Render makes a random one once.
      - key: FLOW_SECRET
        generateValue: true
