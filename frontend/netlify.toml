# The Linework frontend on Netlify. In Netlify, set Base directory to `frontend`, and the environment
# variable BACKEND_URL to the Linework API's address (e.g. https://linework-api.onrender.com): the build
# turns it into a rule in dist/_redirects that proxies /api/* there (see vite.config.js).
[build]
  command = "npm run build"
  publish = "dist"

# Bundling Monaco, the diagram engines and the code parsers needs more than Node's default ~2 GB heap.
[build.environment]
  NODE_OPTIONS = "--max-old-space-size=4096"

# Every page is the app (rules in dist/_redirects, like /api/*, come first).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cross-origin isolation, which running code in the Code view needs (WebContainers for Node.js,
# and stopping Python). "credentialless" still lets cross-origin fonts and images load.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
